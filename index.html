<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-3xl bg-white rounded-2xl shadow-lg p-6 md:p-10">
    <header class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-xl md:text-2xl font-semibold">Tech Quiz</h1>
        <p id="topicLabel" class="text-sm text-slate-500 mt-1">Choose a topic</p>
      </div>
      <div class="text-sm text-slate-500">Progress: <span id="progressText">0 / 0</span></div>
    </header>

    <div id="quizWrap" class="space-y-6">
      <!-- Topic picker or question card injected by JS -->
    </div>

    <div id="quizControls" class="mt-4 hidden items-center justify-between">
      <div class="flex gap-2">
        <button id="prevBtn" class="px-4 py-2 rounded-lg border disabled:opacity-50">Previous</button>
        <button id="nextBtn" class="px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700">Next</button>
      </div>
      <div class="flex items-center gap-3">
        <button id="restartBtn" class="px-3 py-2 text-sm rounded-lg border">Restart</button>
        <div class="text-sm text-slate-500">Time: <span id="timer">00:00</span></div>
      </div>
    </div>

    <!-- Results modal / card -->
    <div id="resultCard" class="mt-6 hidden bg-emerald-50 border-l-4 border-emerald-400 p-4 rounded">
      <h2 class="text-lg font-semibold">Results</h2>
      <p class="mt-2">Score: <strong id="scoreText">0</strong></p>
      <p id="feedback" class="mt-3 text-sm text-slate-700"></p>
      <div class="mt-4">
        <h3 class="text-sm font-semibold text-slate-800">Question feedback</h3>
        <ul id="questionFeedback" class="mt-2 space-y-2 text-sm text-slate-700"></ul>
      </div>
      <div class="mt-4">
        <h3 class="text-sm font-semibold text-slate-800">Recommendations</h3>
        <ul id="recommendations" class="mt-2 space-y-2 text-sm text-slate-700"></ul>
      </div>
    </div>

      Cables: "Review Ethernet (RJ45) versus other cables like HDMI, and when wired networking is useful.",
      Phishing: "Practice spotting fake emails and links that try to steal passwords or payment details.",
      Authentication: "Learn why 2FA adds a second check, such as a phone code, on top of a password.",
      Passwords: "Use long unique passwords and a password manager instead of reusing short phrases.",
      Malware: "Review malware types, especially ransomware, and why backups and caution with files matter.",
      Encryption: "Study HTTPS as encryption in transit so others on the network cannot easily read the traffic.",
      Firewalls: "Learn that firewalls allow or block traffic based on rules to reduce unwanted access.",
      Updates: "Keep software updated so known security holes are patched.",
      "Access control": "Apply least privilege: only the permissions needed for the job, not full admin for everyone.",
      Facilities: "Learn what a datacenter houses: servers, networking, power, and cooling in one facility.",
      Cooling: "Study why heat removal, airflow, and hot/cold aisles keep servers from overheating.",
      Power: "Review UPS and PDUs: backup power for short outages and how power is distributed to racks.",
      Racks: "Learn how racks mount servers and switches in a standard, serviceable layout.",
      Reliability: "Study redundancy and uptime: spare systems so one failure does not take everything down.",
      "Physical security": "Review badge access, cameras, and why unauthorized people should not enter the floor.",
      Operations: "Read what a runbook is: a step-by-step guide for routine work and incidents.",
      "AI concepts": "Start with the idea that AI systems perform tasks that usually need human-like judgment or pattern spotting.",
      "Machine learning": "Learn that models improve from examples, and watch for overfitting on the training set.",
      "Training data": "Study how the quality and bias of training data shape what a model learns.",
      Models: "Treat a model as the learned program that makes predictions or generates output.",
      NLP: "Review natural language processing: AI that works with human language such as text and speech.",
      "Computer vision": "Learn how models identify objects, faces, or text in images and video.",
      "Generative AI": "Practice writing clear prompts and remember these systems create new content, not just classify it.",
      Ethics: "Ask who is affected if training data is biased, private, or used without consent.",
      "Hardware components": "Review the pictured parts and peripherals, then compare their roles and where they connect.",
      "Software applications": "Review the pictured app icons and learn the main task each application is designed for."
    };

    // State
    let selectedKey = null;
    let quiz = [];
    let current = 0;
    let answers = [];
    let secondsElapsed = 0;
    let timerInterval = null;

    // DOM
    const quizWrap = document.getElementById('quizWrap');
    const quizControls = document.getElementById('quizControls');
    const topicLabel = document.getElementById('topicLabel');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const restartBtn = document.getElementById('restartBtn');
    const progressText = document.getElementById('progressText');
    const timerEl = document.getElementById('timer');
    const resultCard = document.getElementById('resultCard');
    const scoreText = document.getElementById('scoreText');
    const feedback = document.getElementById('feedback');
    const questionFeedback = document.getElementById('questionFeedback');
    const recommendations = document.getElementById('recommendations');

    function startTimer(){
      clearInterval(timerInterval);
      secondsElapsed = 0;
      timerEl.textContent = formatTime(secondsElapsed);
      timerInterval = setInterval(()=>{
        secondsElapsed++;
        timerEl.textContent = formatTime(secondsElapsed);
      }, 1000);
    }
    function stopTimer(){ clearInterval(timerInterval); }
    function formatTime(s){
      const mm = String(Math.floor(s/60)).padStart(2,'0');
      const ss = String(s%60).padStart(2,'0');
      return `${mm}:${ss}`;
    }

    function showTopicSelect(){
      stopTimer();
      selectedKey = null;
      quiz = [];
      answers = [];
      current = 0;
      topicLabel.textContent = 'Choose a topic';
      progressText.textContent = '0 / 0';
      timerEl.textContent = '00:00';
      quizControls.classList.add('hidden');
      quizControls.classList.remove('flex');
      resultCard.classList.add('hidden');
      quizWrap.innerHTML = '';

      const intro = document.createElement('p');
      intro.className = 'text-slate-600';
      intro.textContent = 'Pick a quiz topic to get started.';
      quizWrap.appendChild(intro);

      const grid = document.createElement('div');
      grid.className = 'grid gap-4 sm:grid-cols-2';

      Object.entries(topics).forEach(([key, topic]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'text-left p-5 rounded-xl border border-slate-200 bg-white hover:border-indigo-300 hover:shadow-sm focus:ring-2';
        btn.innerHTML = `
          <h2 class="text-lg font-semibold">${escapeHtml(topic.name)}</h2>
          <p class="mt-2 text-sm text-slate-600">${escapeHtml(topic.blurb)}</p>
          <p class="mt-3 text-sm font-medium text-indigo-600">${topic.questions.length} questions</p>
        `;
        btn.addEventListener('click', () => startQuiz(key));
        grid.appendChild(btn);
      });

      quizWrap.appendChild(grid);
    }

    function startQuiz(key){
      const topic = topics[key];
      if (!topic || !topic.questions.length) return;
      selectedKey = key;
      quiz = topic.questions;
      answers = new Array(quiz.length).fill(null);
      current = 0;
      topicLabel.textContent = topic.name;
      quizControls.classList.remove('hidden');
      quizControls.classList.add('flex');
      startTimer();
      render();
    }

    function render(){
      if (!quiz.length) {
        showTopicSelect();
        return;
      }

      quizWrap.innerHTML = '';
      const item = quiz[current];

      const card = document.createElement('section');
      card.className = 'w-full';

      const qHead = document.createElement('div');
      qHead.className = 'mb-3 flex items-start justify-between gap-4';
      qHead.innerHTML = `\n        <div class="flex-1">\n          <h2 class=\"text-lg font-medium\">Question ${current + 1}</h2>\n          <p class=\"mt-1 text-slate-600\">${escapeHtml(item.q)}</p>\n        </div>\n        <div class=\"text-sm text-slate-500\">${current + 1} / ${quiz.length}</div>\n      `;

      card.appendChild(qHead);

      if (item.image) {
        const image = document.createElement('img');
        image.src = item.image.src;
        image.alt = item.image.alt;
        image.className = 'mx-auto mb-4 block h-48 w-full rounded-xl object-contain';
        card.appendChild(image);
      }

      const list = document.createElement('div');
      list.className = 'grid gap-3 sm:grid-cols-2';

      item.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn text-left p-3 rounded-lg border hover:shadow-sm focus:ring-2';
        btn.setAttribute('data-idx', idx);
        btn.setAttribute('aria-pressed', answers[current] === idx ? 'true' : 'false');
        btn.innerHTML = `<div class=\"font-medium\">${String.fromCharCode(65 + idx)}. ${escapeHtml(opt)}</div>`;

        if (answers[current] === idx) {
          btn.classList.add('bg-indigo-50','border-indigo-300');
        } else {
          btn.classList.add('bg-white','border-slate-200');
        }

        btn.addEventListener('click', () => {
          answers[current] = idx;
          render();
        });

        btn.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            btn.click();
          }
        });

        list.appendChild(btn);
      });

      card.appendChild(list);
      quizWrap.appendChild(card);

      prevBtn.disabled = current === 0;
      nextBtn.textContent = current === quiz.length - 1 ? 'Submit' : 'Next';
      progressText.textContent = `${answers.filter(a => a !== null).length} / ${quiz.length}`;
      resultCard.classList.add('hidden');
    }

    prevBtn.addEventListener('click', () => {
      if (current > 0) current--;
      render();
    });

    nextBtn.addEventListener('click', () => {
      if (!quiz.length) return;
      if (current < quiz.length - 1) {
        current++;
        render();
        return;
      }
      submitQuiz();
    });

    restartBtn.addEventListener('click', () => {
      if (!confirm('Restart? Your answers will be cleared and you can pick a topic again.')) return;
      showTopicSelect();
    });

    function submitQuiz(){
      stopTimer();
      let correct = 0;
      const details = [];
      quiz.forEach((q, i) => {
        const chosen = answers[i];
        const isCorrect = chosen === q.answer;
        if (isCorrect) correct++;
        details.push({ item: q, chosen, isCorrect });
      });

      scoreText.textContent = `${correct} / ${quiz.length}`;

      const pct = Math.round((correct / quiz.length) * 100);
      let msg = '';
      if (pct === 100) msg = `Perfect — you have a solid grasp of ${topics[selectedKey].name.toLowerCase()} basics.`;
      else if (pct >= 75) msg = 'Strong result. A bit of review on the missed topics will get you to 100%.';
      else if (pct >= 50) msg = 'You know some of the fundamentals. Focus on the recommendations below, then try again.';
      else msg = 'Start with the topics you missed and retake the quiz when you are ready.';
      feedback.textContent = msg;

      questionFeedback.innerHTML = details.map((d, i) => {
        const letter = (idx) => String.fromCharCode(65 + idx);
        const chosenText = d.chosen === null
          ? 'Skipped'
          : `${letter(d.chosen)}. ${escapeHtml(d.item.options[d.chosen])}`;
        const rightText = `${letter(d.item.answer)}. ${escapeHtml(d.item.options[d.item.answer])}`;
        const status = d.isCorrect ? 'Correct' : 'Incorrect';
        const color = d.isCorrect ? 'text-emerald-700' : 'text-rose-700';
        return `<li class="rounded-lg border border-slate-200 bg-white p-3">
          <p class="font-medium">Q${i + 1}: ${escapeHtml(d.item.q)}</p>
          <p class="${color} mt-1">${status}</p>
          <p class="mt-1">Your answer: ${chosenText}</p>
          ${d.isCorrect ? '' : `<p>Correct answer: ${rightText}</p>`}
        </li>`;
      }).join('');

      if (pct === 100) {
        recommendations.innerHTML = `<li class="rounded-lg border border-slate-200 bg-white p-3">${escapeHtml(topics[selectedKey].nextStep)}</li>`;
      } else {
        const byTopic = new Map();
        details.forEach((d) => {
          const topic = d.item.topic;
          if (!byTopic.has(topic)) {
            byTopic.set(topic, { missed: false });
          }
          if (!d.isCorrect) byTopic.get(topic).missed = true;
        });
        recommendations.innerHTML = [...byTopic.entries()].map(([topic, info]) => {
          const note = studyNotes[topic] || 'Review this topic and try the related questions again.';
          const label = info.missed ? 'Review' : 'Refresh';
          const color = info.missed ? 'text-rose-700' : 'text-slate-500';
          return `<li class="rounded-lg border border-slate-200 bg-white p-3">
            <p class="font-medium">${escapeHtml(topic)} <span class="${color} font-normal">· ${label}</span></p>
            <p class="mt-1">${escapeHtml(note)}</p>
          </li>`;
        }).join('');
      }

      resultCard.classList.remove('hidden');
      resultCard.scrollIntoView({behavior: 'smooth', block: 'center'});
    }

    function escapeHtml(unsafe) {
      return unsafe
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    (function init(){
      showTopicSelect();

      let touchStartX = 0;
      let touchEndX = 0;
      quizWrap.addEventListener('touchstart', (e)=>{ touchStartX = e.changedTouches[0].screenX; });
      quizWrap.addEventListener('touchend', (e)=>{
        if (!quiz.length) return;
        touchEndX = e.changedTouches[0].screenX;
        handleGesture();
      });
      function handleGesture(){
        if (touchEndX + 40 < touchStartX) nextBtn.click();
        if (touchEndX - 40 > touchStartX) prevBtn.click();
      }

      window.addEventListener('keydown', (e)=>{
        if (!quiz.length) return;
        if (e.key === 'ArrowRight') nextBtn.click();
        if (e.key === 'ArrowLeft') prevBtn.click();
      });
    })();

  </script>
</body>
</html>
